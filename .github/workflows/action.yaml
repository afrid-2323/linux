name: test-Matrix

on: 
  push:
    branches: '*'

jobs:
  test:
    outputs:
      version_id: ${{ steps.version.outputs.version_id }}
    runs-on: ${{ matrix.os }}
    strategy:
      # max-parallel: 2
      matrix:
        os: [ ubuntu-latest, windows-latest]
        node-version: [16, 18]
        exclude:
          - os: windows-latest
            node-version: 18
          - os: ubuntu-latest
            node-version: 16
        include:
          - os: ubuntu-latest
            node-version: 18
          - os: windows-latest
            node-version: 16
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install nodejs
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: summary for jobs
        run: |
          echo "result ${{ matrix.node-version }} is passed" >> "$GITHUB_STEP_SUMMARY"

      - name: demo out put
        id: version
        run: |
           echo "version_id=1.0.0" >> $GITHUB_OUTPUT

      - run: echo "${{ steps.version.outputs.version_id }}"

  job2:
    runs-on: ubuntu-slim
    needs: test
    steps:
      - run: echo "joboutput is ${{ needs.test.outputs.version_id }}"
