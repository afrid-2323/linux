name: NopCommerce Docker Build

on:
  push:
    branches:
      - develop

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t nopcommerce:latest .

      - name: Verify Docker image
        run: |
          docker images nopcommerce
