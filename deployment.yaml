apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: k8s-webapp
  template:
    metadata:
      labels:
        app: k8s-webapp
    spec:
      containers:
        - name: nginx
          image: nginx:1.28
          ports:
            - containerPort: 80
